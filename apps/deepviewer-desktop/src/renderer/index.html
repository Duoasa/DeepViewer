<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'" />
    <title>DeepViewer</title>
  </head>
  <body>
    <main id="launch" class="deepviewer-launch" data-phase="starting" aria-busy="true">
      <div class="deepviewer-launch__center">
        <div id="brand-lockup"></div>
        <section id="failure-panel" class="deepviewer-launch__failure" aria-live="polite" hidden>
          <h2 class="deepviewer-launch__failure-title">暂时没能打开工作区</h2>
          <p id="status-detail" class="deepviewer-launch__detail"></p>
          <div id="actions" class="deepviewer-launch__actions" hidden>
            <button id="retry" type="button">重新打开</button>
            <button id="logs" class="secondary" type="button">查看日志</button>
          </div>
        </section>
      </div>
      <p class="deepviewer-launch__status" role="status">
        <span class="deepviewer-launch__dot" aria-hidden="true"></span>
        <span id="status-label">正在打开你的工作区</span>
      </p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
