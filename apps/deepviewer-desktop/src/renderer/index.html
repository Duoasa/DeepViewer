<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'" />
    <title>DeepViewer</title>
  </head>
  <body>
    <main id="launch" class="launch" data-phase="starting" aria-busy="true">
      <section class="loading-lockup" aria-label="DeepViewer">
        <div id="brand-logo" class="brand-logo" aria-hidden="true"></div>
        <h1>DeepViewer</h1>
      </section>

      <section id="failure-panel" class="failure-panel" aria-live="polite" hidden>
        <p id="status-label" class="status-label">正在启动 Harness</p>
        <p id="status-detail" class="status-detail">首次启动可能需要几秒钟。</p>
        <div id="actions" class="actions" hidden>
          <button id="retry" type="button">重试</button>
          <button id="logs" class="secondary" type="button">打开日志</button>
        </div>
      </section>

      <p id="accessible-status" class="visually-hidden" aria-live="polite"></p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
