- insert:
    - id: deepviewer-adapter
      name: "@deepviewer/adapter"
      disabled: !!js "process.env.DEEPVIEWER_DISABLE_BUILTINS === '1'"

- id: ui-brand-official
  disabled: true

- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true
  config:
    enabled: false

# DeepViewer exposes content search in its native history sidebar. Open the native
# SQLite index only when a search is requested, keeping ordinary startup lazy.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

- insert:
    - id: preset-deepviewer-chat
      name: "@deepseek-ai/dsh-agent-preset"
      disabled: !!js "process.env.DEEPVIEWER_DISABLE_BUILTINS === '1'"
      config:
        id: deepviewer-chat
        name: Chat
        description: Workspace-free conversation with web and uploaded attachments.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a helpful conversational assistant. Help with questions, writing,
                discussion, and user-uploaded content. You have no project workspace and
                cannot read local files, execute commands, or modify projects. Use the
                available web tools when appropriate; explain when a capability is unavailable.
                Never claim to have searched or read content unless it was actually provided.
              complete: true
              includeRuntimeContext: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: deepviewer-chat-guard
            name: "@deepviewer/adapter/chat-guard"

# DeepViewer has no upstream feedback collection or session-log upload.
- id: ui-message-feedback
  disabled: true

- id: message-feedback
  disabled: true

- id: command-feedback
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true
